name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"   # chạy mỗi ngày lúc 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:       # cho phép chạy thủ công

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Thang4869&theme=radical&background=0D1117&ring=84B179&fire=84B179&currStreakLabel=84B179&hide_border=false&border=444444&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
