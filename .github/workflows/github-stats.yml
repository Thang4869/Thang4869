name: Update GitHub Stats

on:
  schedule:
    - cron: "0 * * * *"     # chạy mỗi giờ (phút 0)
  workflow_dispatch:        # cho phép chạy thủ công

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Stats card
        run: |
          mkdir -p profile
          curl -s "https://github-readme-stats.vercel.app/api?username=Thang4869&show_icons=true&count_private=true&theme=react&hide_border=false&bg_color=0D1117&title_color=84B179&icon_color=A2CB8B&text_color=888888&border_color=444444&include_all_commits=false&cache_seconds=120" \
            -o profile/stats.svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "Update stats card" || exit 0
          git push
